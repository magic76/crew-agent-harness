plugins {
    id 'java-library'
    id 'maven-publish'
}

def jitpackBuild = System.getenv('JITPACK') == 'true'
def jitpackGroup = "${System.getenv('GROUP') ?: 'com.github.magic76'}.${System.getenv('ARTIFACT') ?: 'crew-agent-harness'}"
def jitpackVersion = System.getenv('VERSION') ?: '0.1.0-SNAPSHOT'

group = jitpackBuild ? jitpackGroup : 'com.magic76.crew'
version = jitpackBuild ? jitpackVersion : '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

publishing {
    publications {
        agentCore(MavenPublication) {
            from components.java
            artifactId = 'agent-core'
        }
    }
}
