name: JitPack Probe

on:
  pull_request:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack by v0.1.1 commit
        run: |
          set +e
          version='c5691fe3d5'
          echo '=== MODULE POM (triggers commit build) ==='
          curl -i -L --max-time 180 "https://jitpack.io/com/github/magic76/crew-agent-harness/agent-core/$version/agent-core-$version.pom"
          echo '\n=== API ==='
          curl -i -L --max-time 30 "https://jitpack.io/api/builds/com.github.magic76/crew-agent-harness/$version"
          echo '\n=== BUILD LOG ==='
          curl -i -L --max-time 30 "https://jitpack.io/com/github/magic76/crew-agent-harness/$version/build.log"
          exit 0
