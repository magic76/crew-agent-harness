name: JitPack Probe

on:
  pull_request:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger and query JitPack v0.1.1
        run: |
          set +e
          echo '=== MODULE POM (triggers build) ==='
          curl -i -L --max-time 120 'https://jitpack.io/com/github/magic76/crew-agent-harness/agent-core/v0.1.1/agent-core-v0.1.1.pom'
          echo '\n=== API ==='
          curl -i -L --max-time 30 'https://jitpack.io/api/builds/com.github.magic76/crew-agent-harness/v0.1.1'
          echo '\n=== BUILD LOG ==='
          curl -i -L --max-time 30 'https://jitpack.io/com/github/magic76/crew-agent-harness/v0.1.1/build.log'
          exit 0
