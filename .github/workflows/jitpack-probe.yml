name: JitPack Probe

on:
  pull_request:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify JitPack release commit module version
        run: |
          set +e
          version='ba4f03a408'
          pom="https://jitpack.io/com/github/magic76/crew-agent-harness/agent-core/$version/agent-core-$version.pom"
          echo '=== MODULE POM (triggers commit build) ==='
          curl -i -L --max-time 180 "$pom"
          echo '\n=== API ==='
          curl -i -L --max-time 30 "https://jitpack.io/api/builds/com.github.magic76/crew-agent-harness/$version"
          echo '\n=== BUILD LOG ==='
          curl -i -L --max-time 30 "https://jitpack.io/com/github/magic76/crew-agent-harness/$version/build.log"
          echo '\n=== MODULE POM RETRY ==='
          curl -i -L --max-time 60 "$pom"
          exit 0
