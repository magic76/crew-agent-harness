name: Release v0.1.0

on:
  push:
    branches: [ main ]
    paths:
      - '.release/v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure v0.1.0 tag exists
        run: |
          if ! git rev-parse -q --verify refs/tags/v0.1.0 >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.1.0 -m "Crew Agent Harness v0.1.0"
            git push origin v0.1.0
          fi

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "GitHub Release v0.1.0 already exists"
            exit 0
          fi
          gh release create v0.1.0 \
            --title "Crew Agent Harness v0.1.0" \
            --notes "First shared agent-core release for Crew Helper, Crew Mate, Crew Teacher, and Crew Story."
