name: Release tagged marker

on:
  push:
    branches: [ main ]
    paths:
      - '.release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release marker
        id: release
        run: |
          marker="$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^\.release/v' | head -n 1)"
          if [ -z "$marker" ]; then
            echo "No release marker found in this commit"
            exit 1
          fi
          version="${marker#.release/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Crew Agent Harness $VERSION"
            git push origin "$VERSION"
          fi

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release $VERSION already exists"
            exit 0
          fi
          gh release create "$VERSION" \
            --title "Crew Agent Harness $VERSION" \
            --notes "Shared agent-core release for Crew apps."
